name: CI

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Dsw2026Tpi.slnx

      - name: Build
        run: dotnet build Dsw2026Tpi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Dsw2026Tpi.slnx --no-build --no-restore --configuration Release
